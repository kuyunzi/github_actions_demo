            const request = new iam.KeystoneListGroupsRequest()
            request.domainId = "120658a586a949e4b5b353c4ce4fd82f"
            const result = client.keystoneListGroups(request)
            result.then(result => {console.log("idp result::" + JSON.stringify(result))}).catch(ex => {console.log("exception:" + JSON.stringify(ex));})
